# Perfil usado apenas no GitHub Actions (Oracle descartavel em container).
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XEPDB1
spring.datasource.username=gestao
spring.datasource.password=gestao

# Executa os scripts dos modulos na ordem de dependencia antes de validar as entidades.
# "optional:" permite que o build passe enquanto um modulo ainda nao entregou o script.
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.sql.init.schema-locations=\
  optional:classpath:banco-de-dados/01-pessoas.sql,\
  optional:classpath:banco-de-dados/02-contas.sql,\
  optional:classpath:banco-de-dados/03-transacoes.sql,\
  optional:classpath:banco-de-dados/04-investimentos.sql,\
  optional:classpath:banco-de-dados/05-dividas.sql,\
  optional:classpath:banco-de-dados/06-planejamentos.sql,\
  optional:classpath:banco-de-dados/07-educacao.sql,\
  optional:classpath:banco-de-dados/08-notificacoes.sql,\
  optional:classpath:banco-de-dados/09-relatorios.sql

spring.jpa.show-sql=false
